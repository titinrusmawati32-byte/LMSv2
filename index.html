<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap');

:root {
  --accent: #FF7A1A;
  --accent-hover: #FF8E36;
  --accent-glow: rgba(255, 122, 26, 0.4);
  --brand: #FFFFFF;
  --canvas: #090D15;
  --card: #131924;
  --card-subtle: #171F2C;
  --line: rgba(255, 255, 255, 0.08);
  --line-light: rgba(255, 255, 255, 0.14);
  --ring: rgba(255, 122, 26, 0.45);
  --t1: #F8FAFC;
  --t2: #94A3B8;
  --t3: #64748B;
  --primary-soft: rgba(255, 122, 26, 0.14);
  --ok-bg: rgba(16, 185, 129, 0.16);
  --ok: #34D399;
  --ok-main: #10B981;
  --warn-bg: rgba(245, 158, 11, 0.16);
  --warn: #FBBF24;
  --warn-main: #F59E0B;
  --bad-bg: rgba(239, 68, 68, 0.16);
  --bad: #F87171;
  --bad-main: #EF4444;
  --gray-bg: rgba(255, 255, 255, 0.05);
  --info-bg: rgba(56, 189, 248, 0.16);
  --info: #38BDF8;
  --r: 16px;
  --rl: 22px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(circle at 18% 12%, #182232 0%, #0D121B 55%, #080B10 100%) fixed;
  color: var(--t1);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
}

h1, h2, h3 { margin: 0; line-height: 1.3; color: #FFFFFF; }
p { margin: .5rem 0; }
a { color: var(--accent); text-decoration: none; }
.hidden { display: none !important; }
.material-symbols-outlined { font-size: 24px; line-height: 1; vertical-align: middle; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.fs40 { font-size: 40px !important; }
.t-lg { font-size: 1.25rem; font-weight: 700; color: #FFFFFF; }
.t-md { font-size: 1.05rem; font-weight: 700; color: #FFFFFF; }
.t0 { margin-top: 0; }
.h2 { font-size: 1.15rem; font-weight: 700; margin: 24px 0 12px; color: #FFFFFF; }
.h2row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; }
.h2row .h2 { margin: 0; }
.pt { font-size: 1.45rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 18px; flex-wrap: wrap; }
.muted { color: var(--t2); font-size: .95rem; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.mt8 { margin-top: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-g { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.line { padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.list { display: block; }

/* ----- Modern Luxury Cards & Hover Effects ----- */
.card {
  background: linear-gradient(145deg, #151D2A 0%, #111722 100%);
  border: 1px solid var(--line);
  border-radius: var(--rl);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.click { cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s; }
.click:hover, .click:focus-visible {
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 18px rgba(255, 122, 26, 0.16);
  border-color: rgba(255, 122, 26, 0.45);
  transform: translateY(-2px);
  outline: none;
}
.ok-card { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.35); }
.warn-card { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); color: #FBBF24; display: flex; gap: 8px; align-items: center; font-weight: 600; }
.big { font-size: 2.3rem; font-weight: 800; color: #FFFFFF; }
.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #182436 0%, #131A26 60%, #181C26 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;
  padding: 26px 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.hero:after {
  content: '';
  position: absolute;
  right: -30px;
  bottom: -40px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 122, 26, 0.15) 0%, transparent 70%);
  pointer-events: none;
}
.hero .opacity { color: var(--accent); font-size: .88rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.hero-t { font-size: 1.65rem; font-weight: 800; margin: 6px 0 6px; color: #FFFFFF; }

/* ----- Buttons with Glowing Orange / Amber Gradient ----- */
.btn {
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #FF6A00 0%, #FF8A24 100%);
  color: #FFFFFF;
  font: inherit;
  font-weight: 700;
  font-size: .95rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  box-shadow: 0 4px 18px rgba(255, 106, 0, 0.35);
  transition: all .15s ease;
}
.btn:hover {
  background: linear-gradient(135deg, #FF7A1A 0%, #FFA043 100%);
  box-shadow: 0 6px 22px rgba(255, 106, 0, 0.5);
  transform: translateY(-1px);
}
.btn:active { transform: scale(.98); }
.btn.block { width: 100%; }
.btn.sec {
  background: #151D2A;
  color: #F8FAFC;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: none;
}
.btn.sec:hover {
  background: #1C2637;
  border-color: rgba(255, 122, 26, 0.45);
  color: #FFFFFF;
}
.btn.danger { background: linear-gradient(135deg, #EF4444, #DC2626); color: #fff; box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35); }
.btn.ghost { background: transparent; color: var(--t2); min-height: 42px; padding: 0 10px; box-shadow: none; }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.06); color: #FFFFFF; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .9rem; border-radius: 12px; }
.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .quiz-opt:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--ring);
}

/* ----- Form Controls in Luxury Dark Theme ----- */
input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  background: #0E141E;
  font: inherit;
  font-size: .98rem;
  color: #F8FAFC;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255, 122, 26, 0.25);
}
textarea { min-height: 110px; resize: vertical; }
input:disabled, textarea:disabled { background: rgba(255, 255, 255, 0.04); color: var(--t3); }
label { display: block; font-weight: 600; font-size: .92rem; margin: 14px 0 6px; color: #E2E8F0; }
.help { font-size: .88rem; color: var(--t2); margin: 6px 0; }
.err { color: #F87171; font-size: .92rem; min-height: 1.2em; margin-top: 8px; font-weight: 600; }

/* ----- Modern Badges & Chips ----- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.badge .material-symbols-outlined { font-size: 16px; }
.b-bad { background: rgba(239, 68, 68, 0.16); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.3); }
.b-ok { background: rgba(16, 185, 129, 0.16); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
.b-warn { background: rgba(245, 158, 11, 0.16); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.3); }
.b-gray { background: rgba(255, 255, 255, 0.08); color: #94A3B8; border: 1px solid rgba(255, 255, 255, 0.1); }
.b-info { background: rgba(56, 189, 248, 0.16); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.12); background: #131924; font: inherit; font-weight: 600; cursor: pointer; color: var(--t2); transition: all .15s; }
.chip:hover { border-color: rgba(255, 122, 26, 0.4); color: #FFFFFF; }
.chip.on { background: linear-gradient(135deg, #FF6A00, #FF8A24); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(255, 106, 0, 0.35); }
.empty { text-align: center; color: var(--t2); padding: 36px 12px; }
.empty .material-symbols-outlined { font-size: 44px; color: var(--t3); }
.icon-circle { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: rgba(255, 122, 26, 0.16); color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tbl th, .tbl td { text-align: left; padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th { color: var(--t2); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; background: #0E141E; }
.tbl tr:hover td { background: rgba(255, 255, 255, 0.02); }

/* ----- Sidebar (Matching Screenshot Style) ----- */
.sidebar { display: none; }
.sidenav { display: flex; flex-direction: column; gap: 6px; }
.sidenav a {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  border-radius: 16px;
  font-size: .95rem;
  font-weight: 600;
  color: #8E9BAE;
  text-decoration: none;
  transition: all .18s ease;
}
.sidenav a:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #F8FAFC;
}
.sidenav a.on {
  background: linear-gradient(135deg, #FF6A00 0%, #FF8A24 100%) !important;
  color: #FFFFFF !important;
  box-shadow: 0 6px 20px rgba(255, 106, 0, 0.45);
  font-weight: 700;
}
.sidenav a.on .material-symbols-outlined { color: #FFFFFF; }
.sb-brand { display: flex; align-items: center; gap: 12px; padding: 6px 6px 22px; color: #fff; }
.sb-logo {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(135deg, #FF6A00, #FF8A24);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 6px 16px rgba(255, 106, 0, 0.35);
}
.sb-logo .material-symbols-outlined { font-size: 28px; }
.sb-bt { display: block; line-height: 1.25; }
.sb-bt b { display: block; font-size: 1.15rem; font-weight: 800; color: #FFFFFF; }
.sb-bt strong { display: block; font-size: .82rem; font-weight: 700; color: #FF9B42; letter-spacing: .02em; }
.sb-bt em { display: block; font-style: normal; font-size: .72rem; color: var(--t2); font-weight: 500; }
.sb-div { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 18px 6px 0; }
.sb-art { margin-top: auto; padding-top: 10px; text-align: center; }
.sb-art svg { width: 100%; height: auto; max-height: 200px; display: block; opacity: .85; }
.sb-motto { text-align: center; color: #E2E8F0; font-weight: 700; font-size: .9rem; line-height: 1.3; font-style: italic; margin: 4px 0 12px; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.sb-credit { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 10px 12px; color: #fff; }
.sb-credit .sb-cav { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 122, 26, 0.2); color: var(--accent); display: grid; place-items: center; flex: none; }
.sb-credit small { display: block; font-size: .7rem; color: var(--t2); }
.sb-credit b { display: block; font-size: .76rem; word-break: break-all; line-height: 1.2; color: #F8FAFC; }

/* ----- Topbar in Glassmorphic Dark Look ----- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: rgba(11, 16, 24, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 68px;
  padding: 8px 18px;
  gap: 12px;
}
.topbar h1 { font-size: 1.35rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em; }
.tb-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.menu-btn { color: #FFFFFF !important; min-height: 44px; padding: 0 8px !important; }
.menu-btn .material-symbols-outlined { font-size: 28px; }
.school-pill {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 6px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  background: #141B26;
  font-weight: 700;
  font-size: .88rem;
  color: #E2E8F0;
}
.sp-logo { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #FF6A00, #FF8A24); color: #fff; display: grid; place-items: center; }
.sp-logo .material-symbols-outlined { font-size: 16px; }
.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 14px 5px 5px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  background: #141B26;
  cursor: pointer;
  transition: border-color .15s;
}
.user-chip:hover { border-color: rgba(255, 122, 26, 0.4); }
.user-chip .av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF6A00, #FF8A24);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: .92rem;
  box-shadow: 0 2px 10px rgba(255, 106, 0, 0.35);
}
.user-chip .who { display: none; flex-direction: column; line-height: 1.2; }
.user-chip .who b { font-size: .92rem; color: #FFFFFF; }
.user-chip .who small { color: #FF9B42; font-size: .78rem; font-weight: 600; }
.topbar .actions { display: flex; gap: 10px; align-items: center; }

/* ----- Welcome Banner (Atmospheric Glow) ----- */
.welcome {
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  align-items: center;
  min-height: 150px;
  border-radius: 24px;
  overflow: hidden;
  padding: 24px 26px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #172336 0%, #131A26 60%, #191E28 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: var(--shadow);
}
.w-main { display: flex; gap: 14px; align-items: flex-start; position: relative; z-index: 2; }
.w-sun { color: #FFA043; flex: none; margin-top: 2px; }
.w-sun .material-symbols-outlined { font-size: 44px; font-variation-settings: 'FILL' 1, 'wght' 500; filter: drop-shadow(0 0 12px rgba(255, 160, 67, 0.45)); }
.w-hi { font-weight: 700; color: #FFA043; font-size: 1.05rem; }
.w-name { font-size: 1.95rem; font-weight: 800; color: #FFFFFF; line-height: 1.15; }
.w-txt { color: #94A3B8; margin: 6px 0 12px; max-width: 440px; font-size: .95rem; }
.w-date {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 600;
  font-size: .88rem;
  color: #E2E8F0;
}
.w-date .material-symbols-outlined { color: #10B981; font-size: 20px; }
.w-date i { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.15); display: inline-block; }
.w-art, .w-quote { display: none; }
.w-quote { font-family: 'Caveat', cursive; font-size: 1.5rem; font-weight: 700; color: #FFA043; line-height: 1.15; text-align: center; max-width: 190px; }
.w-quote .material-symbols-outlined { display: block; margin: 6px auto 0; color: #FF7A1A; font-size: 20px; font-variation-settings: 'FILL' 1; }

/* ----- Stat Cards (NexHome Tactile Tiles) ----- */
.stats4 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.sc {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 16px;
  background: linear-gradient(145deg, #151D2A 0%, #111722 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.sc:hover, .sc:focus-visible {
  transform: translateY(-2px);
  border-color: rgba(255, 122, 26, 0.45);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 18px rgba(255, 122, 26, 0.18);
  outline: none;
}
.sc-ico { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.sc-ico .material-symbols-outlined { font-size: 26px; font-variation-settings: 'FILL' 1, 'wght' 500; }
.sc-num { font-size: 1.85rem; font-weight: 800; color: #FFFFFF; line-height: 1; }
.sc-lab { font-size: .84rem; color: #94A3B8; font-weight: 600; margin-top: 5px; line-height: 1.25; padding-right: 14px; }
.sc-go { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.sc-go .material-symbols-outlined { font-size: 18px; }
.sc.c1 .sc-ico, .sc.c1 .sc-go { background: rgba(56, 189, 248, 0.16); color: #38BDF8; }
.sc.c2 .sc-ico, .sc.c2 .sc-go { background: rgba(16, 185, 129, 0.16); color: #10B981; }
.sc.c3 .sc-ico, .sc.c3 .sc-go { background: rgba(168, 85, 247, 0.16); color: #C084FC; }
.sc.c4 .sc-ico, .sc.c4 .sc-go { background: rgba(255, 106, 0, 0.18); color: #FF8A24; }

/* ----- Dashboard Panels & Charts ----- */
.dg { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
.panel {
  background: linear-gradient(145deg, #141B26 0%, #111722 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  padding: 20px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.panel-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.panel-ico { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.panel-ico.p1 { background: rgba(56, 189, 248, 0.16); color: #38BDF8; }
.panel-ico.p2 { background: rgba(168, 85, 247, 0.16); color: #C084FC; }
.panel-ico.p3 { background: rgba(56, 189, 248, 0.16); color: #38BDF8; }
.panel-ico.p4 { background: rgba(255, 106, 0, 0.18); color: #FF8A24; }
.panel-hd { flex: 1; min-width: 0; }
.panel-t { font-weight: 800; color: #FFFFFF; font-size: 1.05rem; line-height: 1.2; }
.panel-s { font-size: .8rem; color: var(--t2); }
.panel-link { font-size: .84rem; font-weight: 700; color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 4px 0; font-family: inherit; }
.panel .list { display: grid; grid-template-columns: 1fr; gap: 12px; }
.panel .list > .card { margin: 0; box-shadow: none; background: #0E141E; border-color: rgba(255, 255, 255, 0.06); }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-note { font-size: .78rem; color: var(--t2); margin-top: 6px; }
.donut-wrap { display: flex; justify-content: center; }
.donut-wrap svg { width: 190px; height: 190px; }
.legend { margin-top: 12px; }

.qa.q1 { background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.2); } .qa.q1 .qa-ico { background: rgba(56, 189, 248, 0.16); color: #38BDF8; }
.qa.q2 { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.2); } .qa.q2 .qa-ico { background: rgba(16, 185, 129, 0.16); color: #10B981; }

.an-b { flex: 1; min-width: 0; }
.an-t { font-weight: 700; font-size: .92rem; color: #F1F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.an .an-go { color: var(--t3); font-size: 20px; }
.an .badge { font-size: .74rem; padding: 3px 10px; }

/* Admin Users Table */
.ut { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .9rem; }
.ut th { background: #0E141E; color: #94A3B8; text-align: left; font-size: .78rem; font-weight: 700; padding: 10px 14px; }
.ut th:first-child { border-radius: 12px 0 0 12px; } .ut th:last-child { border-radius: 0 12px 12px 0; }

.ut .uname { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #F8FAFC; }
.ut .uav { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 800; color: #fff; flex: none; }

.panel-empty { text-align: center; color: var(--t2); padding: 20px 8px; font-size: .9rem; }

/* Layout Grid */
.main { padding: 16px 16px calc(100px + env(safe-area-inset-bottom, 0px)); max-width: 1280px; margin: 0 auto; overflow-x: hidden; }
.bnav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(68px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(11, 16, 24, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
  display: flex;
  z-index: 30;
}
.bnav a {
  display: flex;

  justify-content: center;

  font-weight: 700;

}
.bnav a.on { color: var(--accent); }
.bnav a.on::after {
  content: '';

  top: 0;
  width: 28px;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: linear-gradient(90deg, #FF6A00, #FF8A24);

}

/* Modals & Dialogs */
.modal { position: fixed; inset: 0; background: rgba(5, 8, 14, 0.78); backdrop-filter: blur(10px); display: flex; align-items: flex-end; justify-content: center; z-index: 80; }
.modal .sheet {

  border: 1px solid rgba(255, 255, 255, 0.1);

  max-height: 94vh;
  overflow: auto;
  border-radius: 26px;
  padding: 28px 30px calc(24px + env(safe-area-inset-bottom, 0px));

  color: #F8FAFC;
}
.modal .x { position: absolute; top: 14px; right: 14px; min-width: 44px; min-height: 44px; border: 0; background: transparent; cursor: pointer; color: var(--t2); display: grid; place-items: center; }
.modal .x:hover { color: #fff; }
.modal-t { font-size: 1.3rem; font-weight: 800; margin: 0 40px 6px 0; color: #FFFFFF; }
.once { background: #0E141E; border: 1px solid rgba(255,255,255,0.08); padding: 14px; border-radius: var(--r); font-size: 1.2rem; font-weight: 700; white-space: pre-wrap; word-break: break-all; color: #FFA043; }
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: #1A2232;
  border: 1px solid rgba(255, 122, 26, 0.4);
  color: #FFFFFF;
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 700;
  font-size: .92rem;
  z-index: 90;
  max-width: 90%;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
.toast.show { opacity: 1; }

/* Submenu Kuis & Bank Soal */
.subnav-wrap { display: flex; gap: 8px; background: #121824; padding: 6px; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 20px; overflow-x: auto; }
.subnav-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: var(--t2);
  font: inherit;
  font-weight: 700;
  font-size: .95rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.subnav-btn:hover { background: rgba(255, 255, 255, 0.05); color: #FFFFFF; }
.subnav-btn.active { background: linear-gradient(135deg, #FF6A00, #FF8A24); color: #fff; box-shadow: 0 4px 16px rgba(255, 106, 0, 0.4); }
.subnav-btn .badge-pill { padding: 2px 8px; border-radius: 999px; font-size: .78rem; background: rgba(255, 255, 255, 0.25); color: inherit; }
.subnav-btn:not(.active) .badge-pill { background: rgba(255, 255, 255, 0.08); color: var(--t2); }

.bank-item { background: linear-gradient(145deg, #151D2A 0%, #111722 100%); border: 1px solid var(--line); border-radius: var(--rl); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.bank-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.bank-opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 12px; }
.bank-opt-item { display: flex; align-items: flex-start; gap: 8px; padding: 9px 13px; border-radius: 12px; background: #0E141E; border: 1px solid rgba(255, 255, 255, 0.08); font-size: .95rem; color: #F1F5F9; }
.bank-opt-item.correct-opt { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #34D399; font-weight: 700; }
.bank-opt-letter { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.08); color: #CBD5E1; font-size: .8rem; font-weight: 800; flex: none; }
.bank-opt-item.correct-opt .bank-opt-letter { background: #10B981; color: #fff; }

/* Question Image Box */
.quiz-img-box { margin: 14px 0; text-align: center; background: #0E141E; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 12px; overflow: hidden; }
.quiz-img-box img { max-width: 100%; max-height: 360px; object-fit: contain; border-radius: 10px; display: inline-block; }

/* Student Exam Navigation Grid */
.quiz-nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; margin: 14px 0; max-height: 160px; overflow-y: auto; padding: 4px; }
.quiz-nav-num { min-height: 42px; border: 1.5px solid rgba(255, 255, 255, 0.14); border-radius: 12px; background: #121824; font: inherit; font-weight: 800; font-size: .95rem; color: #CBD5E1; display: grid; place-items: center; cursor: pointer; transition: all .15s; }
.quiz-nav-num:hover { border-color: var(--accent); color: var(--accent); }
.quiz-nav-num.answered { background: #10B981; color: #fff; border-color: #059669; }
.quiz-nav-num.current { border-color: #FF8A24; box-shadow: 0 0 0 3px rgba(255, 138, 36, 0.35); color: #FF8A24; }
.quiz-nav-num.answered.current { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.45); }

/* Question Option in Exam Mode */
.quiz-top { background: #131924; border: 1px solid var(--line); border-radius: var(--rl); padding: 16px; position: sticky; top: 0; z-index: 5; box-shadow: var(--shadow); }
.timer-pill { font-weight: 800; font-size: 1.1rem; padding: 6px 16px; border-radius: 999px; background: rgba(255, 122, 26, 0.16); color: var(--accent); font-variant-numeric: tabular-nums; }
.timer-pill.warn { background: rgba(239, 68, 68, 0.2); color: #F87171; }
.progress { height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
.progress div { height: 100%; background: linear-gradient(90deg, #10B981, #34D399); transition: width .3s; }
.qcard { padding: 20px; }
.quiz-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 12px 18px;
  margin-top: 10px;
  background: #0E141E;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--rl);
  font: inherit;
  font-size: 1.05rem;
  font-weight: 600;
  color: #F1F5F9;
  text-align: left;
  cursor: pointer;
  transition: all .15s;
}
.quiz-opt:hover { border-color: rgba(255, 122, 26, 0.4); background: #141C2A; }
.quiz-opt.on { background: rgba(255, 106, 0, 0.15); border: 2px solid #FF8A24; color: #FFA043; }
.letter { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); font-weight: 800; flex: none; color: #CBD5E1; }
.quiz-opt.on .letter { background: #FF8A24; color: #fff; }

/* Progress Loader Bar */
.top-loader {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 3px;
  background: linear-gradient(90deg, #FF6A00, #FFA534, #FF7A1A);
  z-index: 99999;
  transform: translateX(-100%);
  transition: transform .25s ease, opacity .25s;
  pointer-events: none;
  opacity: 0;
}
.top-loader.active { opacity: 1; animation: topLoaderAnim 1.2s infinite ease-in-out; }
@keyframes topLoaderAnim { 0% { transform: translateX(-100%); } 50% { transform: translateX(0%); } 100% { transform: translateX(100%); } }
.view-loading { opacity: .6; pointer-events: none; transition: opacity .15s ease; }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Materi Styles */
.mthumb { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; }

.mthumb.j-drive { background: rgba(56, 189, 248, 0.18); color: #38BDF8; }
.mthumb.j-file { background: rgba(168, 85, 247, 0.18); color: #C084FC; }
.mthumb.j-link { background: rgba(255, 255, 255, 0.08); color: #94A3B8; }

/* Login / Auth Screen */
.auth-wrap { max-width: 460px; margin: 0 auto; padding: 36px 18px calc(28px + env(safe-area-inset-bottom, 0px)); }
.logo-big {
  width: 84px; height: 84px; border-radius: 24px;
  background: linear-gradient(135deg, #FF6A00, #FF8A24);

}
.auth-badge { display: table; margin: 14px auto 8px; padding: 4px 14px; border-radius: 999px; background: rgba(255, 122, 26, 0.15); color: #FFA043; font-weight: 700; font-size: .88rem; }

.demo { background: rgba(255, 122, 26, 0.08); border-color: rgba(255, 122, 26, 0.25); margin-top: 14px; }

  .w-art { display: block; align-self: end; margin: 0 -6px -24px 0; }

  .app.collapsed .sb-bt, .app.collapsed .sb-art, .app.collapsed .sb-motto, .app.collapsed .sb-credit, .app.collapsed .sb-div, .app.collapsed .sidenav a > span:not(.material-symbols-outlined) { display: none; }

}

@media (min-width: 768px) and (max-width: 1099.98px) {

}

@media (max-width: 767.98px) {

}

}
.w-date { white-space: nowrap; flex-wrap: nowrap; }

.welcome > *, .w-main > div, .sc > div, .dg > * { min-width: 0; }
